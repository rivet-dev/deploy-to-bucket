name: Deploy to Bucket
description: Publish a built static website with production and PR hostnames
inputs:
    account-id:
        description: Cloudflare account containing the existing bucket
        required: true
    bucket:
        description: Existing R2 bucket dedicated to this website
        required: true
    access-key-id:
        description: R2 Object Read & Write access key scoped to this bucket
        required: true
    secret-access-key:
        description: Secret key paired with the bucket-scoped access key
        required: true
    cloudflare-token:
        description: Cloudflare token for exact Worker custom domains (see SETUP.md)
        required: true
    zone-id:
        description: Cloudflare zone containing all website hostnames
        required: true
    worker:
        description: Existing router Worker name
        required: true
    hostname-timeout:
        description: Seconds to wait for DNS and HTTPS readiness (1-3600)
        default: "600"
    preview-domain:
        description: Dedicated preview suffix; exact hostnames are created on demand
        required: true
    domain:
        description: Production hostname to attach to the Worker
        required: true
    directory:
        description: Build output directory relative to working-directory
        default: dist
    working-directory:
        description: Website directory
        default: .
    main-branch:
        description: Production branch
        default: main
    config:
        description: Optional JSON routing configuration relative to working-directory
        default: ""
    github-token:
        description: Token for PR comments
        default: ${{ github.token }}
outputs:
    url:
        description: Published URL
        value: ${{ steps.deploy.outputs.url }}
    release-url:
        description: Immutable release URL
        value: ${{ steps.deploy.outputs.release-url }}
runs:
    using: composite
    steps:
        - name: Prepare action
          shell: bash
          env:
              ACTION_PATH: ${{ github.action_path }}
          run: |
              action_dir=$(mktemp -d "$RUNNER_TEMP/r2-website.XXXXXX")
              cp "$ACTION_PATH/dist/"*.js "$ACTION_PATH/package.json" "$ACTION_PATH/package-lock.json" "$action_dir/"
              npm ci --omit=dev --ignore-scripts --prefix "$action_dir" --workspaces=false
              echo "R2_ACTION_DIR=$action_dir" >> "$GITHUB_ENV"
        - name: Deploy or clean up
          id: deploy
          shell: bash
          env:
              CF_API_TOKEN: ${{ inputs.cloudflare-token }}
              CF_ZONE_ID: ${{ inputs.zone-id }}
              CF_WORKER: ${{ inputs.worker }}
              SITE_HOSTNAME_TIMEOUT: ${{ inputs.hostname-timeout }}
              R2_ACCOUNT_ID: ${{ inputs.account-id }}
              R2_BUCKET: ${{ inputs.bucket }}
              R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
              R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
              SITE_PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
              SITE_DOMAIN: ${{ inputs.domain }}
              SITE_DIRECTORY: ${{ inputs.directory }}
              SITE_WORKDIR: ${{ inputs.working-directory }}
              SITE_MAIN: ${{ inputs.main-branch }}
              SITE_CONFIG: ${{ inputs.config }}
              GH_TOKEN: ${{ inputs.github-token }}
          run: node "$R2_ACTION_DIR/deploy.js"
